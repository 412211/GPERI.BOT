{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="icon" href="{% static 'images/bot.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex justify-content-center align-items-center" style="height: 100vh;background-color:#1c1b1b;">

   

    <div class="login-box shadow mx-auto p-4 rounded" style="
    max-width:500px;">
        <img src="{% static 'images/bot.png' %}" width="170" class="d-block mx-auto mb-2" alt="">
        <h4 class="text-center mb-3 text-white">Sign Up</h4>


    <form method="post">

        {% csrf_token %}

        <div class="mb-3 form-floating">
            <input name="fname"  type="text" class="form-control form-control-lg" placeholder="" required>
            <label class="form-label text-secondary mb-1">Full Name</label>
        </div>

        <div class="d-flex gap-3">

            <div class="mb-3 flex-grow-1">
                <div class="form-floating">
                    <input name="contact" type="text" class="form-control form-control-lg" placeholder="">
                    <label class="form-label text-secondary mb-1">Mobile No.</label>
                </div>
        </div>

        <div class="mb-3 flex-grow-1">
            <div class="form-floating">
            <input name="email" type="text" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Email-ID</label>
            </div>
        </div>


        </div>


        <!-- <div class="mb-3 form-floating">
            <input type="text" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Address</label>
        </div> -->


        <div class="d-flex gap-3">
        <div class="mb-3 form-floating flex-grow-1">            
            <input name="createpass" type="password" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1"> Create Password</label>
        </div>
        
        <div class="mb-3 form-floating flex-grow-1">
            <input name="confirmpass" type="password" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Confirm Password</label>
        </div>
        </div>
        <p class="text-danger">
            {{pwdError}}
        </p>

    

        <!-- <a href="" class="text-decoration-none text-white"> -->
        <button type="submit" class="btn btn-theme text-white w-100 my-2">Register</button>
    <!-- </a> -->
        <a href="/login/" class="d-block text-center small text-decoration-none text-light">Login</a>

    </form>
    </div>
    

    
    


    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
