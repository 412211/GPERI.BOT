{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="icon" href="{% static 'images/bot.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex justify-content-center align-items-center" style="height: 100vh;background-color:#1c1b1b;">

   
    
    <div class="login-box shadow mx-auto p-4 rounded" style="background-color:#292A2D;">
        <img src="{% static 'images/bot.png' %}" width="170" class="d-block mx-auto mb-1" alt="">
        <h4 class="text-center mb-3 text-white">Sign In</h4>

        <form method="post">
            {% csrf_token %}

        <div class="mb-3 form-floating">
            <input name="email" type="text" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Email</label>
        </div>

        <div class="mb-3 form-floating">
            
            <input name="password"  type="password" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Password</label>
        </div>

    

        <a href="/forgot/" class="float-end text-decoration-none small text-light">Forgot password ?</a>

        <p class="text-danger">
            {{errorMsg}}
        </p>

        <button type="submit" class="btn btn-theme text-white w-100 my-4" >Login</button>

    


        <a href="/register/" class="d-block text-center small text-decoration-none text-light">Create a New Account</a>
        
    </form>

    </div>

    
    


    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
