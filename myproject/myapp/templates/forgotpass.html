{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="icon" href="{% static 'images/bot.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex justify-content-center align-items-center" style="height: 100vh;background-color:#1c1b1b;">

   

    <div class="login-box shadow mx-auto p-4 rounded" style="background-color:#292A2D;">
        <img src="{% static 'images/bot.png' %}" width="170" class="d-block mx-auto mb-2" alt="">
        <h4 class="text-center mb-3 text-white">Reset Password</h4>

        <div class="mb-3 form-floating">
            <input type="text" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">New Password</label>
        </div>

        <div class="mb-3 form-floating">
            
            <input type="password" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Confirm Password</label>
        </div>

        

        <button class="btn btn-theme text-white w-100 my-3">Update Password</button>
        <a href="/login/" class="d-block text-center small text-decoration-none text-light">Login</a>
    </div>

    
    


    <script src="{%static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
