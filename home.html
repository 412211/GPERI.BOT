<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gperi.Bot</title>
    <link rel="icon" href="../images/bot.png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
</head>
<body>


    <div class="main">
        <div class="left p-3">
            <div class="d-flex justify-content-between align-items-center  py-4 mb-3">
                <h4 class="mb-0 text-white-50">GPERI.BOT</h4>
                <i class="fa-regular fa-circle-left fs-4 text-white-50"></i>
            </div>
            <div class="">
                <button class="newchat btn btn-primary border-0  rounded-pill px-3 mb-4"><i class="fa-regular fa-message me-2 small"></i> New Chat <i class="fa-solid fa-plus small ms-2"></i></button>

                <h6 class="text-secondary small">Today</h6>
                <div class=" d-flex justify-content-between bg-secondary px-3 py-1 rounded align-items-center">
                    <span class="text-white">Hi</span>
                    <button class="btn btn-outline-danger border-0 rounded-pill   mb-1">
                        <a href="#"><i class="fa-regular fa-trash-can text-white"></i></a>
                    </button>
                </div>


                <div class="d-flex gap-3 align-items-center py-3 position-absolute bottom-0">
                    <img src="https://www.pngall.com/wp-content/uploads/5/Profile-Avatar-PNG-Picture.png" width="40" alt="">
                    <h6 class="text-white-50 mb-0">My Profile</h6>
                </div>
            </div>
        </div>
        <div class="right p-4">

            <div class="d-flex align-items-center ps-5 ms-5 gap-3 mb-4">
                <img src="/images/bot.png" width="70" alt="">
                <h4 class="text-white-50 mb-0">GPERI.BOT</h4>
                
            </div>
            <hr class="text-white">

            <div class="mx-5 px-5">
                <div class="text-end">
                    <p class="text-white mb-0  d-inline-block p-2 px-3 rounded"  style="background-color: #333;">Hello</p>
                </div>


                
                <div class="d-inline-flex gap-2 text-white-50 align-items-center" >
                    <img src="../images/bot.png" width="35" alt="">
                    <p class="mb-0 p-2 px-3 rounded" style="background-color: #333;">Welcome to GPERI.BOT </p>
                </div>
                

                
            </div>
            

<!-- 
            <div class="text-white">

                <div class="d-flex gap-3 align-items-center mb-3">
                    <img class="bot" src="../images/bot.png" alt="">
                    <h4 class="mb-0 ">Hi, I am GPERI.BOT</h4>
                </div>

                <span class="small text-white-50 ms-5">How can I help you today?</span>
            </div> -->

            <div class="bottom-chat-sec d-flex gap-3 align-items-center py-2">
                <input type="text" class="border-0" placeholder="Message to GPERI.BOT">
               <i class="send fa-regular rounded-circle fa-circle-up fs-2 text-white-50"></i>
            </div>
        </div>
    </div>
    


    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
