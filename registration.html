<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="icon" href="images/bot.png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

   

    <div class="login-box shadow w-50 mx-auto p-4 rounded bg-white">
        <img src="images/bot.png" width="200" class="d-block mx-auto mb-3" alt="">
        <h4 class="text-center mb-3">Sign Up</h4>

        <div class="mb-3 form-floating">
            <input type="text" class="form-control form-control-lg" placeholder="" required>
            <label class="form-label text-secondary mb-1">Full Name</label>
        </div>

        <div class="d-flex gap-3">

            <div class="mb-3 flex-grow-1">
                <div class="form-floating">
                    <input type="text" class="form-control form-control-lg" placeholder="">
                    <label class="form-label text-secondary mb-1">Mobile No.</label>
                </div>
        </div>

        <div class="mb-3 flex-grow-1">
            <div class="form-floating">
            <input type="text" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Email-ID</label>
            </div>
        </div>


        </div>


        <div class="mb-3 form-floating">
            <input type="text" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Address</label>
        </div>


        <div class="d-flex gap-3">
        <div class="mb-3 form-floating flex-grow-1">            
            <input type="password" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1"> Create Password</label>
        </div>
        
        <div class="mb-3 form-floating flex-grow-1">
            <input type="password" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Confirm Password</label>
        </div>
        </div>

        <a href="login.html" class="text-decoration-none text-white">
        <button class="btn btn-theme text-white w-100 my-4">Register</button></a>
        <a href="login.html" class="d-block text-center small text-decoration-none">Login</a>

        
    </div>

    
    


    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
