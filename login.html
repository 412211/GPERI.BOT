<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="icon" href="images/bot.png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

   

    <div class="login-box shadow w-25 mx-auto p-4 rounded bg-white">
        <img src="images/bot.png" width="200" class="d-block mx-auto mb-3" alt="">
        <h4 class="text-center mb-3">Sign In</h4>

        <div class="mb-3 form-floating">
            <input type="text" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Username</label>
        </div>

        <div class="mb-3 form-floating">
            
            <input type="password" class="form-control form-control-lg" placeholder="">
            <label class="form-label text-secondary mb-1">Password</label>
        </div>

        <a href="forgotpass.html" class="float-end text-decoration-none small">Forgot password ?</a>

        <button class="btn btn-theme text-white w-100 my-4">Login</button>

        <a href="registration.html" class="d-block text-center small text-decoration-none">Create a New Account</a>
    </div>

    
    


    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
